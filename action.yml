name: 'Ringside Deploy Bot'
description: 'Announces CI and deploy results as robot-combat fight commentary in Discord.'
branding:
  icon: 'zap'
  color: 'red'
inputs:
  status:
    description: 'Result of the job (success, failure, cancelled, started, rerun).'
    required: true
  webhook:
    description: 'Discord webhook URL.'
    required: true
  run-url:
    description: 'Optional link back to the workflow run.'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Announce result
      shell: bash
      run: node ${{ github.action_path }}/index.js
      env:
        DEPLOY_STATUS: ${{ inputs.status }}
        DISCORD_WEBHOOK_URL: ${{ inputs.webhook }}
        RUN_URL: ${{ inputs.run-url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_WORKFLOW: ${{ github.workflow }}
